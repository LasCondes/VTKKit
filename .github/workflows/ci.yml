name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.configuration }}, VTK readers)
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: Tests/requirements-vtk.txt
      - name: Install VTK readers
        run: |
          python -m pip install --only-binary=:all: -r Tests/requirements-vtk.txt
      - name: Verify reader runtime
        run: python -c 'import numpy, vtk; print("VTK", vtk.vtkVersion.GetVTKVersion())'
      - name: Run tests
        env:
          VTKKIT_PYTHON: ${{ steps.python.outputs.python-path }}
          CONFIGURATION: ${{ matrix.configuration }}
        run: swift test --configuration "$CONFIGURATION"

  apple-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile library
        run: |
          xcodebuild build \
            -scheme VTKKit \
            -destination "generic/platform=$PLATFORM" \
            -configuration Release \
            -derivedDataPath ".build/xcode-$PLATFORM" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
